name: Supply Chain Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required for actions/attest-build-provenance to create attestations.
  attestations: write
  contents: read
  # Required for OIDC token signing of provenance attestations.
  id-token: write

jobs:
  artifacts:
    name: SBOM, Audit, and Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24

      - name: Run dependency audit
        id: dependency-audit
        continue-on-error: true
        run: pnpm audit --audit-level=high --json > pnpm-audit.json

      - name: Run TanStack lockfile policy
        run: pnpm security:tanstack

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
          upload-artifact: false

      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-artifacts
          path: |
            pnpm-audit.json
            sbom.spdx.json
          retention-days: 30

      - name: Attest supply-chain artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pnpm-audit.json
            sbom.spdx.json

      - name: Fail on dependency audit findings
        if: steps.dependency-audit.outcome == 'failure'
        run: |
          echo "pnpm audit reported high-severity vulnerabilities; see pnpm-audit.json in the uploaded artifact."
          exit 1
