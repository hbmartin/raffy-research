engineStrict: true
sideEffectsCache: false

overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.0
  '@types/node': ^24
  body-parser: 1.20.4
  effect: 3.21.2
  # PR #40, 2026-05-27: keep toolchain consumers on a known-good current glob 13 release.
  # Re-evaluate after the next dependency compatibility pass confirms the override is no longer needed.
  glob: 13.0.6
  # better-auth 1.6.13 advertises kysely 0.29 support, but its kysely adapter
  # still imports root migration constants removed at runtime in kysely 0.29.
  kysely: 0.28.17
  qs: 6.15.2
  'react-cosmos>ws': 8.20.1
  # Patch transitive advisories pulled in by the workflow SDK's unused
  # framework adapters (@workflow/astro): undici and devalue.
  'undici@>=7.0.0 <7.24.0': '>=7.24.0'
  'devalue@>=5.6.3 <=5.8.0': '>=5.8.1'

peerDependencyRules:
  allowedVersions:
    '@tailwindcss/typography>tailwindcss': '4'

allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': false
  '@tailwindcss/oxide': true
  bufferutil: false
  cbor-extract: false
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  ssh2: false
